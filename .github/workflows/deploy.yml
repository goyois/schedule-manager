name: CI/CD

# AWS + Docker 배포 파이프라인. 전체 절차/사전 준비물은 DEPLOYMENT.md 참고.
#
# 전제:
# - AWS에 GitHub OIDC 공급자 + 이 워크플로가 assume할 수 있는 IAM 역할이 만들어져 있다
#   (DEPLOYMENT.md "GitHub Actions용 IAM 역할" 절) - 그래서 여기엔 AWS Access Key를 전혀 다루지 않는다.
# - 리포지토리 Secrets에 APP_SERVER_SSH_KEY(앱 서버 EC2 접속용 SSH 개인키)가 등록돼 있다.
# - 아래 env의 AWS_ROLE_ARN / ECR_REPOSITORY_URI / APP_SERVER_HOST를 실제 값으로 바꿔서 쓴다.

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::489023881839:role/gh-actions-deploy-role
  ECR_REPOSITORY_URI: 489023881839.dkr.ecr.ap-northeast-2.amazonaws.com/schedule-manager
  APP_SERVER_HOST: 3.34.129.83

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d api"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: enable pgvector/uuid-ossp extensions
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d api -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=ci psql -h localhost -U ci -d api -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: write CI-only local profile
        # spring.profiles.default가 local이라 이 파일이 있어야 컨텍스트가 뜬다. 값은 전부 이 잡의
        # 서비스 컨테이너를 가리키거나(진짜 비밀이 아님) 형식만 맞으면 되는 더미값이다(AI/구글 키는
        # 실제로 호출되지 않는 한 부팅 시 형식 검증만 통과하면 된다) - 실제 운영 비밀과는 무관하다.
        run: |
          cat > src/main/resources/application-local.yml <<'EOF'
          spring:
            datasource:
              driver-class-name: org.postgresql.Driver
              url: jdbc:postgresql://localhost:5432/api
              username: ci
              password: ci
            jpa:
              hibernate:
                ddl-auto: update
            data:
              redis:
                host: localhost
                port: 6379
            ai:
              anthropic:
                api-key: dummy-ci-key
                chat:
                  options:
                    model: claude-opus-4-8
              openai:
                api-key: dummy-ci-key
            jwt:
              secret: ci-only-dummy-secret-key-must-be-at-least-256-bits-long
              expiration: 1800000
              refresh-expiration: 1209600000

          google:
            oauth:
              client-id: dummy-ci-client-id
          EOF

      - name: run tests
        run: ./gradlew test -PciBuild --no-daemon

      - name: upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # aws-actions/configure-aws-credentials의 OIDC 토큰 발급에 필요
      contents: read
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # cache-from/to: type=gha가 Dockerfile의 --mount=type=cache(~/.gradle)까지 포함해 GitHub
      # Actions 캐시에 저장/복원한다 - src가 바뀌어도 매 실행마다 Gradle 의존성을 통째로 새로 받지
      # 않는다. plain "docker build"/"docker push"였을 때는 이 캐시 백엔드를 쓸 방법이 없어
      # docker/build-push-action으로 바꿨다
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REPOSITORY_URI }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.ECR_REPOSITORY_URI }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: deploy to app server over SSH
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          SSH_KEY: ${{ secrets.APP_SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ env.APP_SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/deploy_key deploy/deploy.sh "ec2-user@${{ env.APP_SERVER_HOST }}:/home/ec2-user/deploy.sh"
          ssh -i ~/.ssh/deploy_key "ec2-user@${{ env.APP_SERVER_HOST }}" \
            "chmod +x /home/ec2-user/deploy.sh && /home/ec2-user/deploy.sh ${{ env.ECR_REPOSITORY_URI }} $IMAGE_TAG ${{ env.AWS_REGION }}"
