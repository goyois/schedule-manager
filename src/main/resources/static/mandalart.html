<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>만다라트 · Schedule Manager</title>
  <!-- 라이트로 한번 그려졌다가 다크로 바뀌는 깜빡임(FOUC)을 막으려고, CSS가 실제로 반영되기 전에
       저장된 테마를 동기적으로 먼저 심어둔다(js/theme.js는 </body> 직전에 로드돼 너무 늦다) -->
  <script>
    (function () {
      var t = localStorage.getItem("sm_theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="shell-page">
  <div class="quote-bar">
    <div id="quote-banner" class="quote-banner"></div>
    <a class="btn btn-ghost btn-sm quote-bar-icon-btn" href="/report" title="기간별 리포트" aria-label="기간별 리포트">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
    </a>
    <a class="btn btn-ghost btn-sm quote-bar-icon-btn" href="/settings" title="자동화 설정" aria-label="자동화 설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </a>
    <button type="button" class="btn btn-ghost btn-sm quote-bar-icon-btn" id="theme-toggle-btn" title="다크 모드로 전환" aria-label="다크 모드로 전환"></button>
    <button class="btn btn-ghost btn-sm" id="logout-btn">로그아웃</button>
  </div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand-row">
        <a class="auth-brand" href="/dashboard">
          <img class="logo-mark" src="/images/logo.png" alt="AI 갓생비서 로고" />
          <div class="logo-text">AI 갓생비서</div>
        </a>
        <button type="button" class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="사이드바 접기/펼치기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="3"></rect>
            <line x1="9" y1="4" x2="9" y2="20"></line>
          </svg>
        </button>
      </div>

      <div class="sidebar-section">
        <a class="btn btn-ghost btn-sm" style="width: 100%; display: block; text-align: center" href="/dashboard">← 대시보드로</a>
      </div>

      <div class="sidebar-section sidebar-section-scroll">
        <h3>내 만다라트</h3>
        <ul class="category-list" id="board-list"></ul>
        <form class="add-category-form" id="add-board-form">
          <input type="text" id="new-board-title" placeholder="새 만다라트 제목" required />
          <button type="submit" class="btn btn-ghost btn-sm">추가</button>
        </form>
      </div>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="user-avatar">?</div>
          <div class="who">
            <div class="name" id="user-name">사용자</div>
            <div class="email" id="user-email">-</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="mandalart-header">
        <h1 class="mandalart-page-title" id="board-title">만다라트를 선택하거나 새로 만들어주세요</h1>
        <button type="button" class="btn btn-primary btn-sm" id="ai-fill-board-btn" style="display: none; width: auto"
                title="중앙 9칸(핵심 목표 + 세부목표 8개)을 채운 뒤 누르면, 나머지 빈 칸을 AI가 채워줍니다">
          🤖 AI로 채우기
        </button>
      </div>

      <div class="mandalart-grid" id="mandalart-grid"></div>
    </main>
  </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 도움말 버튼 - 마우스를 올리면(:hover/:focus-within, css) 짧은 설명 말풍선이 뜨고, 누르면
       첫 방문 때 봤던 이 페이지 가이드 투어(js/mandalart-onboarding.js)를 언제든 다시 볼 수 있다 -->
  <div class="help-widget" id="help-widget">
    <div class="help-widget-tooltip">가이드를 다시 볼 수 있어요</div>
    <button type="button" class="help-widget-btn" id="restart-tour-btn" title="가이드 다시 보기" aria-label="가이드 다시 보기">❓</button>
  </div>

  <script src="/js/quotes.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/mandalart.js"></script>
  <script src="/js/tour.js"></script>
  <script src="/js/mandalart-onboarding.js"></script>
</body>
</html>
