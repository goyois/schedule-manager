<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대시보드 · Schedule Manager</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="shell-page">
  <div class="quote-bar">
    <div id="quote-banner" class="quote-banner"></div>
    <a class="btn btn-ghost btn-sm quote-bar-icon-btn" href="/report" title="기간별 리포트" aria-label="기간별 리포트">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
    </a>
    <a class="btn btn-ghost btn-sm quote-bar-icon-btn" id="settings-link" href="/settings" title="자동화 설정" aria-label="자동화 설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </a>
    <button class="btn btn-ghost btn-sm" id="logout-btn">로그아웃</button>
  </div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand-row">
        <a class="auth-brand" href="/dashboard">
          <img class="logo-mark" src="/images/logo.png" alt="AI 갓생비서 로고" />
          <div class="logo-text">AI 갓생비서</div>
        </a>
        <button type="button" class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="사이드바 접기/펼치기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="3"></rect>
            <line x1="9" y1="4" x2="9" y2="20"></line>
          </svg>
        </button>
      </div>

      <div class="sidebar-section sidebar-section-scroll">
        <h3>카테고리 <span id="category-count"></span></h3>
        <ul class="category-list" id="category-list">
          <li class="active" data-category-id="">
            <span><span class="dot"></span>전체 일정</span>
          </li>
        </ul>
        <form class="add-category-form" id="add-category-form">
          <input type="text" id="new-category-name" placeholder="새 카테고리" required />
          <button type="submit" class="btn btn-ghost btn-sm">추가</button>
        </form>

        <!-- ADMIN 전용: 모든 유저에게 공개되는 기본 카테고리 생성. USER 는 볼 수 없어야 하므로
             기본값을 숨김으로 두고, dashboard.js 가 /api/users/me 로 userType 을 확인한 뒤에만 보여준다 -->
        <form class="add-category-form admin-add-category-form admin-only" id="add-default-category-form" style="display:none">
          <div class="admin-caption">관리자 전용 · 기본 카테고리</div>
          <input type="text" id="new-default-category-name" placeholder="기본 카테고리 이름" required />
          <button type="submit" class="btn btn-primary btn-sm">생성</button>
        </form>
      </div>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="user-avatar">?</div>
          <div class="who">
            <div class="name" id="user-name">사용자</div>
            <div class="email" id="user-email">-</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="view-toolbar">
        <div class="view-switcher" id="view-switcher">
          <button type="button" class="view-tab active" data-view="board">보드</button>
          <button type="button" class="view-tab" data-view="day">일</button>
          <button type="button" class="view-tab" data-view="week">주</button>
          <button type="button" class="view-tab" data-view="month">월</button>
          <button type="button" class="view-tab" data-view="year">년</button>
        </div>
      </div>

      <div class="main-header">
        <div class="header-widgets">
          <a class="mandalart-widget" id="mandalart-widget" href="/mandalart" title="만다라트 만들기/수정">
            <div class="mandalart-goal-preview-grid compact" id="mandalart-widget-grid"></div>
            <div class="mandalart-widget-label">만다라트</div>
            <div class="mandalart-widget-subtitle" id="mandalart-widget-subtitle"></div>
          </a>

          <button type="button" class="achievement-widget" id="achievement-widget" title="클릭하면 다른 비유로 바뀝니다">
            <div class="achievement-track">
              <div class="achievement-fill" id="achievement-fill"></div>
              <div class="achievement-emoji" id="achievement-emoji">🎯</div>
            </div>
            <div class="achievement-headline" id="achievement-headline">0%</div>
            <div class="achievement-detail" id="achievement-detail">오늘 일정 진행률</div>
          </button>

          <div class="month-radar" id="month-radar">
            <button type="button" class="clock-filter-btn" id="radar-filter-btn" title="표시할 카테고리 선택">⚙</button>
            <div class="clock-filter-popover" id="radar-filter-popover">
              <div class="clock-filter-popover-title">표시할 카테고리 선택</div>
              <div class="clock-filter-options" id="radar-filter-options"></div>
            </div>
            <div class="month-radar-face">
              <svg id="month-radar-svg" viewBox="0 0 247 247" width="247" height="247" role="img" aria-label="현재 뷰 카테고리별 일정 통계 레이더"></svg>
            </div>
          </div>

          <div class="today-clock" id="today-clock">
            <button type="button" class="clock-filter-btn" id="clock-filter-btn" title="카테고리별로 표시">⚙</button>
            <div class="clock-filter-popover" id="clock-filter-popover">
              <div class="clock-filter-popover-title">카테고리만 선택해서 보기</div>
              <div class="clock-filter-options" id="clock-filter-options"></div>
            </div>
            <div class="today-clock-face">
              <svg id="today-clock-svg" viewBox="0 0 160 160" width="180" height="180" role="img" aria-label="오늘 일정 12시간 시계"></svg>
              <div class="clock-tooltip" id="clock-tooltip"></div>
            </div>
            <div class="today-clock-legend" id="today-clock-legend"></div>
          </div>
        </div>
      </div>

      <div class="board-title-center">
        <div class="board-title-text">
          <h1 id="board-title">전체 일정</h1>
          <div class="today-nav show" id="today-nav">
            <button type="button" class="icon-btn" id="today-nav-prev" title="전날">‹</button>
            <div class="today" id="today-label"></div>
            <button type="button" class="icon-btn" id="today-nav-next" title="다음날">›</button>
          </div>
          <div class="today-nav" id="view-nav">
            <button type="button" class="icon-btn" id="view-nav-prev" title="이전">‹</button>
            <div class="today" id="view-range-label"></div>
            <button type="button" class="icon-btn" id="view-nav-next" title="다음">›</button>
          </div>
        </div>
        <div class="board-title-actions">
          <button type="button" class="btn btn-ghost btn-sm" id="board-compact-toggle-btn" title="일정 카드 접기">▤ 접기</button>
          <button type="button" class="btn btn-ghost btn-sm" id="open-recurring-modal" title="반복 일정 추가">🔁 반복 일정</button>
          <button type="button" class="btn btn-primary btn-sm" id="open-create-modal" title="새 일정 추가">+ 새 일정</button>
        </div>
      </div>

      <div class="board" id="board">
        <!-- 컬럼은 dashboard.js 가 렌더링합니다 -->
      </div>

      <div class="calendar-view" id="calendar-view">
        <!-- 일/주/월/년 그리드는 dashboard.js 가 렌더링합니다 -->
      </div>
    </main>
  </div>
  </div>

  <!-- 도움말 버튼 - AI 챗봇 아이콘 바로 위에 쌓인다. 마우스를 올리면(:hover/:focus-within, css)
       짧은 설명 말풍선이 뜨고, 누르면 첫 로그인 때 봤던 기능 가이드 투어(js/onboarding.js)를
       언제든 다시 볼 수 있다 -->
  <div class="help-widget" id="help-widget">
    <div class="help-widget-tooltip">기능 가이드를 다시 볼 수 있어요</div>
    <button type="button" class="help-widget-btn" id="restart-tour-btn" title="가이드 다시 보기" aria-label="가이드 다시 보기">❓</button>
  </div>

  <!-- 오른쪽 상단에 고정된 챗봇 캐릭터 - 말풍선으로 "AI에게 추천받을 수 있다"는 걸 먼저 알려주고,
       캐릭터를 누르면 기존과 동일하게 AI 추천 모달이 열린다(id는 그대로 유지) -->
  <div class="ai-chatbot-widget" id="ai-chatbot-widget">
    <div class="ai-chatbot-bubble" id="ai-chatbot-bubble">
      <button type="button" class="ai-chatbot-bubble-close" id="ai-chatbot-bubble-close" title="닫기" aria-label="닫기">×</button>
      안녕하세요! 제가 일정을 추천해드릴게요 🗓️
      <span class="ai-chatbot-bubble-tail"></span>
    </div>
    <button type="button" class="ai-chatbot-avatar" id="open-ai-suggest-modal" title="AI 일정 추천받기">🤖</button>
  </div>

  <!-- 전체 화면을 덮는 모달이 아니라, 로봇 아이콘 위에서 펼쳐지는 작은 채팅창 - 배경을 가리지 않으므로
       열어둔 채로 보드/사이드바 등 페이지의 다른 부분을 그대로 조작할 수 있다 -->
  <div class="ai-chat-panel" id="ai-chat-panel">
    <div class="ai-chat-header">
      <h2>AI 일정 추천</h2>
      <div class="ai-chat-header-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="ai-chat-clear-btn" title="대화 내용을 모두 지웁니다">대화 초기화</button>
        <button type="button" class="ai-chat-close-btn" id="ai-chat-close-btn" title="닫기" aria-label="닫기">×</button>
      </div>
    </div>

    <div class="ai-chat-messages" id="ai-chat-messages"></div>

    <div class="ai-suggest-loading" id="ai-suggest-loading" style="display: none" aria-label="AI가 답변을 작성하는 중">
      <div class="ai-suggest-loading-avatar">🤖</div>
      <div class="ai-suggest-loading-bubble">
        <span class="ai-typing-dot"></span>
        <span class="ai-typing-dot"></span>
        <span class="ai-typing-dot"></span>
      </div>
    </div>

    <form id="ai-suggest-form" class="ai-chat-input-row">
      <textarea id="ai-suggest-prompt" rows="1" placeholder="무엇을 추천받고 싶으신가요?" required></textarea>
      <button type="submit" class="btn btn-primary" style="width: auto" id="ai-suggest-submit-btn">전송</button>
    </form>
  </div>

  <!-- 만다라트 위젯을 누르면 바로 이동하지 않고 이 미리보기 모달부터 보여준다 - 배경(오버레이)을
       누르면 닫히고, 미리보기 자체(mandalart-preview-link)를 누르면 그때 /mandalart 로 이동한다 -->
  <div class="modal-overlay" id="mandalart-preview-modal-overlay">
    <div class="modal mandalart-preview-modal">
      <h2>만다라트</h2>
      <a class="mandalart-preview-link" id="mandalart-preview-link" href="/mandalart" title="만다라트 페이지로 이동">
        <div class="mandalart-goal-preview-grid" id="mandalart-preview-modal-grid"></div>
        <div class="mandalart-widget-subtitle" id="mandalart-preview-modal-subtitle"></div>
      </a>
      <p class="mandalart-preview-hint">눌러서 만다라트 페이지로 이동하세요</p>
    </div>
  </div>

  <!-- 위 미리보기 모달의 세부목표 칸에 마우스를 올리면 그 세부목표에 대응하는 바깥 3x3 블록(실행항목
       8개 + 세부목표 사본)을 이 팝오버로 한 번 더 보여준다(dashboard.js attachMandalartSubBlockHover) -
       모달-오버레이 방식이 아니라 마우스가 벗어나면 바로 사라지는 가벼운 팝오버라, 여기서는 modal-overlay
       래퍼 없이 fixed 위치의 카드 하나로만 둔다 -->
  <div class="mandalart-subblock-popover" id="mandalart-subblock-popover">
    <div class="mandalart-subblock-popover-title" id="mandalart-subblock-popover-title"></div>
    <div class="mandalart-goal-preview-grid compact" id="mandalart-subblock-popover-grid"></div>
  </div>

  <div class="modal-overlay" id="schedule-detail-modal-overlay">
    <div class="modal">
      <div class="detail-top">
        <span class="tag category-tag" id="detail-category"></span>
        <span class="detail-status">
          <span class="status-dot" id="detail-status-dot"></span>
          <span id="detail-status-label"></span>
        </span>
      </div>
      <h2 id="detail-title"></h2>
      <div class="detail-time" id="detail-time"></div>
      <p class="detail-content" id="detail-content"></p>
      <div class="detail-meta" id="detail-meta"></div>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="detail-delete-btn">삭제</button>
        <button type="button" class="btn btn-ghost" id="close-detail-modal-btn">닫기</button>
        <button type="button" class="btn btn-primary" style="width: auto" id="detail-edit-btn">수정</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="schedule-modal-overlay">
    <div class="modal">
      <h2 id="modal-title">새 일정</h2>
      <form id="schedule-form">
        <input type="hidden" id="schedule-id" />

        <div class="field">
          <label for="title">제목</label>
          <input type="text" id="title" placeholder="일정 제목" required />
        </div>

        <div class="field">
          <label for="content">내용</label>
          <textarea id="content" rows="3" placeholder="상세 내용"></textarea>
        </div>

        <div class="field checkbox-field">
          <label>
            <input type="checkbox" id="no-end-time-toggle" />
            알림처럼 시작 시간만 설정 (종료 시간 없음)
          </label>
        </div>

        <!-- datetime-local의 시:분 표시는 브라우저/OS 로케일을 그대로 따라가버려서(한국어 로케일은
             오전/오후 12시간제) 24시간제를 강제할 수 없었다. date + 시(0~23) + 분(0~59) 숫자 입력으로
             직접 구성해 표시 형식을 완전히 통제한다 - 실제 값은 hidden input(#startAt/#endAt)에
             "YYYY-MM-DDTHH:MM"로 유지되고, 나머지 로직은 전부 그 hidden input을 기준으로 그대로 동작한다 -->
        <div class="modal-row" id="schedule-time-row">
          <div class="field">
            <label for="startAt-date">시작</label>
            <div class="datetime-24h-group">
              <input type="date" id="startAt-date" required />
              <input type="number" id="startAt-hour" min="0" max="23" placeholder="시" required />
              <span class="dt-colon">:</span>
              <input type="number" id="startAt-minute" min="0" max="59" placeholder="분" required />
            </div>
            <input type="hidden" id="startAt" />
          </div>
          <div class="field" id="end-time-field">
            <label for="endAt-date">종료</label>
            <div class="datetime-24h-group">
              <input type="date" id="endAt-date" required />
              <input type="number" id="endAt-hour" min="0" max="23" placeholder="시" required />
              <span class="dt-colon">:</span>
              <input type="number" id="endAt-minute" min="0" max="59" placeholder="분" required />
            </div>
            <input type="hidden" id="endAt" />
          </div>
        </div>

        <div class="modal-row">
          <div class="field">
            <label for="category-select">카테고리</label>
            <select id="category-select"></select>
          </div>
          <div class="field">
            <label for="status-select">상태</label>
            <select id="status-select">
              <option value="PENDING">대기</option>
              <option value="IN_PROGRESS">진행중</option>
              <option value="COMPLETED">완료</option>
              <option value="CANCELLED">취소</option>
            </select>
          </div>
        </div>

        <input type="hidden" id="user-id-input" />

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancel-modal-btn">취소</button>
          <button type="submit" class="btn btn-primary" style="width: auto">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 영양제 먹기/운동/식단처럼 매번 손으로 입력하기 귀찮은 반복 일정 - 이 폼에서 규칙(요일/시간/기간)만
       한 번 만들어두면 서버가 실제 일정을 미리 여러 개 만들어둔다(RecurringScheduleService).
       각 occurrence는 그냥 평범한 일정이라 만든 뒤엔 기존 상세보기/수정/삭제를 그대로 쓸 수 있고,
       반복 자체를 그만두려면 /settings 페이지에서 중단할 수 있다 -->
  <div class="modal-overlay" id="recurring-modal-overlay">
    <div class="modal">
      <h2>반복 일정 추가</h2>
      <form id="recurring-form">
        <div class="field">
          <label for="recurring-title">제목</label>
          <input type="text" id="recurring-title" placeholder="예: 영양제 먹기" required />
        </div>

        <div class="field">
          <label for="recurring-content">내용</label>
          <textarea id="recurring-content" rows="2" placeholder="상세 내용"></textarea>
        </div>

        <div class="field">
          <label>반복 요일</label>
          <div class="weekday-picker" id="recurring-weekday-picker">
            <button type="button" class="weekday-btn" data-day="MONDAY">월</button>
            <button type="button" class="weekday-btn" data-day="TUESDAY">화</button>
            <button type="button" class="weekday-btn" data-day="WEDNESDAY">수</button>
            <button type="button" class="weekday-btn" data-day="THURSDAY">목</button>
            <button type="button" class="weekday-btn" data-day="FRIDAY">금</button>
            <button type="button" class="weekday-btn" data-day="SATURDAY">토</button>
            <button type="button" class="weekday-btn" data-day="SUNDAY">일</button>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" style="width: auto; margin-top: 8px" id="recurring-select-daily">매일 선택</button>
        </div>

        <div class="modal-row">
          <div class="field">
            <label for="recurring-start-time">시작 시각</label>
            <input type="time" id="recurring-start-time" required />
          </div>
          <div class="field">
            <label for="recurring-end-time">종료 시각 (선택)</label>
            <input type="time" id="recurring-end-time" />
          </div>
        </div>

        <div class="modal-row">
          <div class="field">
            <label for="recurring-start-date">시작일</label>
            <input type="date" id="recurring-start-date" required />
          </div>
          <div class="field">
            <label for="recurring-end-date">종료일 (선택, 없으면 무기한)</label>
            <input type="date" id="recurring-end-date" />
          </div>
        </div>

        <div class="field">
          <label for="recurring-category-select">카테고리</label>
          <select id="recurring-category-select"></select>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancel-recurring-modal-btn">취소</button>
          <button type="submit" class="btn btn-primary" style="width: auto" id="recurring-submit-btn">추가</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 일정 시작 시각 알림. 여러 일정이 동시에 시작하면 카드가 세로로 쌓인다 -->
