<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 · Schedule Manager</title>
  <!-- 라이트로 한번 그려졌다가 다크로 바뀌는 깜빡임(FOUC)을 막으려고, CSS가 실제로 반영되기 전에
       저장된 테마를 동기적으로 먼저 심어둔다(js/theme.js는 </body> 직전에 로드돼 너무 늦다) -->
  <script>
    (function () {
      // theme.js의 currentUserThemeKey()와 반드시 같은 로직이어야 한다 - 계정별로 테마를 분리하기
      // 위해 로그인 계정(email/id)을 키에 넣는다(없으면 로그인 전 공용 anonymous 버킷)
      var key = "sm_theme_anonymous";
      try {
        var raw = localStorage.getItem("sm_current_user");
        var user = raw ? JSON.parse(raw) : null;
        var identifier = user && (user.email || user.id);
        if (identifier) key = "sm_theme_" + identifier;
      } catch (e) {}
      var t = localStorage.getItem(key);
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <img class="logo-mark" src="/images/logo.png" alt="AI 갓생비서 로고" />
        <div class="logo-text">AI 갓생비서</div>
      </div>
      <h1>다시 오셨네요</h1>
      <p class="subtitle">일정을 확인하려면 로그인하세요.</p>

      <div id="alert" class="form-alert"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" placeholder="비밀번호" required />
        </div>
        <button type="submit" class="btn btn-primary">로그인</button>
      </form>

      <div class="auth-divider"><span>또는</span></div>
      <div id="google-signin-button" class="google-signin-button"></div>

      <div class="auth-footer">
        계정이 없으신가요? <a href="/signup">회원가입</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleSignIn()"></script>
</body>
</html>
